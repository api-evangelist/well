name: Well
description: >-
  Well is a personalized health engagement platform for employers and their
  workforce, marketed as "your personalized daily health partner." It pairs an
  AI-driven health engine that delivers tailored interventions and behavior-change
  nudges with human "Well Guides," across a mobile and web experience, and ties
  outcomes to a performance-based ROI guarantee for the sponsoring employer. Well
  powers wellness programs, health challenges, biometric screenings, premium
  reductions, and rewards for large employer and benefits clients including Bank
  of America, USAA, Sam's Club, UNC Health, MGM, Regions, Amentum, and Octapharma.
  The company is backed by General Catalyst and was added to the API Evangelist
  network as a venture-portfolio lead; enrichment found a public WordPress
  marketing/campaign presence at well.co but no public developer API, SDKs,
  documentation, or developer portal.
